name: Static site checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Check release API and invitation timing
        run: node scripts/check-release.cjs
